auth_allow_cleartext = yes
# Junk is "spam" with \Junk (cPanel's name); "Junk" is a decoy without the attribute, as on the
# live amy@ mailbox. The image's own namespace keeps its "/" separator.
namespace inbox {
  mailbox spam {
    special_use = \Junk
    auto = create
  }
  mailbox Junk {
    auto = create
  }
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
}
