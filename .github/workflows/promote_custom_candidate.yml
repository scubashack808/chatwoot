name: Promote custom Chatwoot candidate

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Exact candidate digest, including sha256 prefix
        required: true
        type: string
      commit:
        description: Exact 40-character Git commit recorded in the candidate
        required: true
        type: string
      candidate_run_id:
        description: Successful candidate workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Successful candidate workflow run attempt
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/a-t-m-reef/chatwoot

concurrency:
  group: custom-image-promotion
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'a-t-m-reef/chatwoot'
      && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/integration/v4.16')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    outputs:
      digest: ${{ steps.inputs.outputs.digest }}
      commit: ${{ steps.inputs.outputs.commit }}
      candidate_run_id: ${{ steps.inputs.outputs.candidate_run_id }}
      candidate_run_attempt: ${{ steps.inputs.outputs.candidate_run_attempt }}
      source_ref: ${{ steps.candidate.outputs.source_ref }}
    steps:
      - name: Validate immutable inputs
        id: inputs
        shell: bash
        env:
          DIGEST: ${{ inputs.digest }}
          COMMIT: ${{ inputs.commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest must be sha256 followed by 64 lowercase hexadecimal characters"
            exit 1
          fi
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be exactly 40 lowercase hexadecimal characters"
            exit 1
          fi
          if [[ ! "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::candidate_run_id must be a positive integer"
            exit 1
          fi
          if [[ ! "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::candidate_run_attempt must be a positive integer"
            exit 1
          fi
          {
            echo "digest=$DIGEST"
            echo "commit=$COMMIT"
            echo "candidate_run_id=$CANDIDATE_RUN_ID"
            echo "candidate_run_attempt=$CANDIDATE_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Verify successful candidate workflow attempt and receipt
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ inputs.digest }}
          COMMIT: ${{ inputs.commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        run: |
          set -euo pipefail
          run_json="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/attempts/$CANDIDATE_RUN_ATTEMPT"
          )"
          if ! jq -e \
            --arg commit "$COMMIT" \
            '.status == "completed"
              and .conclusion == "success"
              and .head_sha == $commit
              and .path == ".github/workflows/build_custom_candidate.yml"
              and (.event == "push" or .event == "workflow_dispatch")
              and (.head_branch == "develop" or .head_branch == "integration/v4.16")' \
            <<< "$run_json" >/dev/null; then
            echo "::error::Candidate workflow attempt is not a successful build for this commit"
            exit 1
          fi
          source_ref="refs/heads/$(jq -r '.head_branch' <<< "$run_json")"

          artifact_name="custom-image-candidate-$COMMIT-$CANDIDATE_RUN_ID-$CANDIDATE_RUN_ATTEMPT"
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir candidate-evidence

          if ! jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$COMMIT" \
            --arg digest "$DIGEST" \
            --arg run_id "$CANDIDATE_RUN_ID" \
            --arg run_attempt "$CANDIDATE_RUN_ATTEMPT" \
            --arg source_ref "$source_ref" \
            '.repository == $repository
              and .commit == $commit
              and .digest == $digest
              and .run_id == $run_id
              and .run_attempt == $run_attempt
              and .source_ref == $source_ref' \
            candidate-evidence/candidate-receipt.json >/dev/null; then
            echo "::error::Candidate receipt does not match the requested run, commit, and digest"
            exit 1
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ inputs.digest }}
          COMMIT: ${{ inputs.commit }}
          SOURCE_REF: ${{ steps.candidate.outputs.source_ref }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE_NAME@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/build_custom_candidate.yml" \
            --source-digest "$COMMIT" \
            --source-ref "$SOURCE_REF" \
            --deny-self-hosted-runners

      - name: Verify image revision without executing it
        shell: bash
        env:
          DIGEST: ${{ inputs.digest }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_NAME@$DIGEST"
          image_commit="$(
            docker image inspect "$IMAGE_NAME@$DIGEST" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )"
          if [[ "$image_commit" != "$COMMIT" ]]; then
            echo "::error::Image revision $image_commit does not match requested commit $COMMIT"
            exit 1
          fi

  promote:
    if: >-
      github.repository == 'a-t-m-reef/chatwoot'
      && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/integration/v4.16')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-image-promotion
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or verify approved tag
        id: promote
        shell: bash
        env:
          DIGEST: ${{ needs.verify.outputs.digest }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          source_ref="$IMAGE_NAME@$DIGEST"
          approved_ref="$IMAGE_NAME:approved-$COMMIT"
          existing_digest=""
          if existing_manifest="$(docker buildx imagetools inspect "$approved_ref" 2>/dev/null)"; then
            existing_digest="$(
              sed -n 's/^Digest:[[:space:]]*//p' <<< "$existing_manifest" \
                | head -n 1
            )"
            if [[ -z "$existing_digest" ]]; then
              echo "::error::Could not parse the existing approved tag digest"
              exit 1
            fi
          fi

          if [[ -n "$existing_digest" && "$existing_digest" != "$DIGEST" ]]; then
            echo "::error::$approved_ref already points to a different digest"
            exit 1
          fi

          if [[ -z "$existing_digest" ]]; then
            docker buildx imagetools create --tag "$approved_ref" "$source_ref"
          fi

          promoted_digest="$(
            docker buildx imagetools inspect "$approved_ref" \
              | sed -n 's/^Digest:[[:space:]]*//p' \
              | head -n 1
          )"
          if [[ "$promoted_digest" != "$DIGEST" ]]; then
            echo "::error::Promotion digest verification failed"
            exit 1
          fi

          echo "approved_ref=$approved_ref" >> "$GITHUB_OUTPUT"

      - name: Write promotion receipt
        shell: bash
        env:
          DIGEST: ${{ needs.verify.outputs.digest }}
          COMMIT: ${{ needs.verify.outputs.commit }}
          CANDIDATE_RUN_ID: ${{ needs.verify.outputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.verify.outputs.candidate_run_attempt }}
          APPROVED_REF: ${{ steps.promote.outputs.approved_ref }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$COMMIT" \
            --arg image "$IMAGE_NAME" \
            --arg digest "$DIGEST" \
            --arg approved_ref "$APPROVED_REF" \
            --arg deploy_ref "$IMAGE_NAME@$DIGEST" \
            --arg candidate_run_id "$CANDIDATE_RUN_ID" \
            --arg candidate_run_attempt "$CANDIDATE_RUN_ATTEMPT" \
            --arg actor "$GITHUB_ACTOR" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg promoted_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              repository: $repository,
              commit: $commit,
              image: $image,
              digest: $digest,
              approved_ref: $approved_ref,
              deploy_ref: $deploy_ref,
              candidate_run_id: $candidate_run_id,
              candidate_run_attempt: $candidate_run_attempt,
              actor: $actor,
              run_url: $run_url,
              promoted_at: $promoted_at,
              deployment_performed: false
            }' > promotion-receipt.json

      - name: Upload promotion receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: custom-image-promotion-${{ needs.verify.outputs.commit }}-${{ github.run_id }}
          path: promotion-receipt.json
          if-no-files-found: error
          retention-days: 365
